[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmeter-reading"
version = "0.1.0"
requires-python = ">=3.10"
description = "Image-only water meter reading baseline"

[tool.setuptools]
packages = ["meter_reader"]
package-dir = {meter_reader = "."}

[tool.setuptools.package-data]
meter_reader = ["config.yaml"]
